<!doctype html>
<html lang="es">
  <head>
    <script>
      // Aplica el tema persistido (Zustand + persist) antes del primer
      // paint para evitar parpadeo. Si no hay nada guardado, dark-first
      // por defecto (design-system.md).
      (function () {
        try {
          var raw = localStorage.getItem('pokedex-pro-theme')
          var theme = raw ? JSON.parse(raw).state.theme : 'dark'
          document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pokédex Pro — explora, busca y guarda tus Pokémon favoritos."
    />
    <meta name="theme-color" content="#120607" />
    <title>Pokédex Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
